# cargo-about configuration: the license notices of every Rust crate compiled
# into a shipped Splitlane binary. `scripts/generate-licenses.sh` renders them
# with `packaging/licenses/about.hbs`, and the release packages carry the
# result as THIRD_PARTY_LICENSES.md.

# Keep this list in step with `[licenses] allow` in deny.toml: cargo-deny
# decides which licenses may enter the graph, cargo-about reproduces their
# texts. A license accepted by one and not the other fails one of the two
# checks before a release does.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "NCSA",
    "GPL-3.0",
    "GPL-3.0-or-later",
    # deny.toml admits BSL-1.0 for xxhash-rust 0.8.16 only; cargo-deny keeps
    # that scope, this list only has to be able to print the text.
    "BSL-1.0",
]

# Every platform a package is built for. Dependencies that only one platform
# links are listed too, so one file serves all packages.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Test-only crates never reach a binary.
ignore-dev-dependencies = true
# Build scripts and proc macros do not ship either, but some of them generate
# code that does, so they stay in the listing.
ignore-build-dependencies = false

# Two GPUI support crates from the pinned Zed revision omit the `license`
# field. They sit in the Zed repository beside the other GPUI crates, carry
# the same LICENSE-APACHE link to the repository's Apache-2.0 text, and are
# built as part of GPUI, so they are clarified to Apache-2.0 against that
# file. A GPUI bump that changes the text changes the checksum and fails the
# generation, which is the moment to look again.
[gpui_shared_string.clarify]
license = "Apache-2.0"
files = [{ path = "LICENSE-APACHE", checksum = "752daf2fb234ca4a1fa372c073fe127f44b7b90fd2529ae44273a64f9d53da7a" }]

[gpui_util.clarify]
license = "Apache-2.0"
files = [{ path = "LICENSE-APACHE", checksum = "752daf2fb234ca4a1fa372c073fe127f44b7b90fd2529ae44273a64f9d53da7a" }]
