# splitlane.dev. For now this Worker only sends the phone page's old address
# on to app.splitlane.dev, where the page lives on an origin of its own;
# everything else is a 404 until the site is built.
#
# The site goes beside it: add an [assets] block with its files and keep
#   run_worker_first = ["/app", "/app/*"]
# in it, so that the redirect in src/index.js answers those paths whatever
# the site's files are. The site may run any script it likes; the page and
# its key are on another origin.
name = "splitlane-site"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "splitlane.dev", custom_domain = true }]
