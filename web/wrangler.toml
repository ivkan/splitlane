# The phone's page, served as static files at the root of app.splitlane.dev.
# No code runs on Cloudflare's side: the Worker is its assets alone. The page
# has the origin to itself so that nothing else served there - the site on
# splitlane.dev in particular - can run script beside the key it keeps.
name = "splitlane-phone"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "app.splitlane.dev", custom_domain = true }]

[assets]
directory = "public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
