[package]
name = "splitlane-ghostty-smoke"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
native = [
    "dep:splitlane-terminal-ghostty",
    "dep:portable-pty",
    "splitlane-terminal-ghostty/native",
]

[[bin]]
name = "splitlane-ghostty-smoke"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
anyhow.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
portable-pty = { version = "0.9.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
splitlane-terminal-ghostty = { path = "../splitlane-terminal-ghostty", optional = true }

[lints]
workspace = true
