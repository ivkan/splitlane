[package]
name = "splitlane-mcp-install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPU-free install engine for the Splitlane MCP bridge: per-agent detection, idempotent config merge/backup/atomic-write primitives, and the `splitlane mcp install|uninstall|status` orchestrator."

[dependencies]
# `preserve_order` keeps an agent config's existing key order on merge
# (IndexMap, not the default sorted BTreeMap), so `splitlane mcp install`
# appends the `splitlane` entry without rewriting the user's whole file
# alphabetically - minimal-diff writes into ~/.claude.json etc. Cargo
# feature unification propagates this to splitlane-app's serde_json too
# (harmless: JSON object key order is not semantically meaningful).
serde_json = { workspace = true, features = ["preserve_order"] }
# Format-preserving TOML editing (comments + key order) for Codex's
# `~/.codex/config.toml`. Kept OUT of the embedded `splitlane-mcp` bridge
# binary: this crate links only into `splitlane-app`, never into
# the size-budgeted bridge.
toml_edit = "0.22"
# Match the versions already compiled in the src-app dep graph so this
# crate adds no new transitive build (src-app pins which 8; dirs 6 matches
# splitlane-acp); `which` is already used elsewhere in the workspace.
which.workspace = true
dirs.workspace = true
anyhow.workspace = true
# Surfaces shell-out failures (e.g. `claude mcp add` non-zero exit) to
# stderr via the host's env_logger before the direct-merge fallback runs.
log.workspace = true
# Used by `io::write_atomic` for same-dir temp file + atomic rename (not
# test-only), so it lives in [dependencies], not [dev-dependencies].
tempfile.workspace = true
# Bound `claude mcp add` / `codex mcp add` shell-outs with a wall-clock deadline. std-only, no transitive build.
splitlane-process = { workspace = true }

[lints]
workspace = true
