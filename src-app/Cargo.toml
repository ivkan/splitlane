[package]
name = "splitlane-app"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[features]
default = ["libghostty-linux", "libghostty-windows"]
# Linux-only backend backed by the pinned libghostty-vt archive. It is the
# standard backend for cargo run, development builds, and official releases.
# The target-specific dependencies keep it inert on macOS/Windows.
# Enabling it never clones or downloads from build.rs.
libghostty-linux = [
    "dep:splitlane-terminal-ghostty",
    "dep:portable-pty",
    "splitlane-terminal-ghostty/native",
]
# Windows backend backed by the pinned static wrapper and the ConPTY host. It is
# enabled in standard builds so `terminal.backend = "auto"` can select Ghostty
# on supported x64 MSVC Windows targets. Target-specific dependencies keep it
# inert on Linux/macOS, and `--no-default-features` preserves an Alacritty-only
# recovery build.
libghostty-windows = [
    "dep:splitlane-terminal-ghostty",
    "dep:portable-pty",
    "splitlane-terminal-ghostty/native",
]

[[bin]]
name = "splitlane"
path = "src/main.rs"

[dependencies]
# GPUI framework pinned to a minimal Splitlane fork of Zed. The pinned commit
# is based on zed-industries/zed@afc13dc8 and carries one additive performance
# patch: `Markdown::append` accumulates streamed chunks in a private String
# buffer while preserving Zed's `source() -> &SharedString` contract. The fork
# also keeps the append-throughput Criterion benchmark.
#
# Switchover: when the append optimization lands in zed-industries/zed, point
# the eight entries back to upstream and keep an exact tested revision. Until
# then, create each bump from the chosen upstream revision, reapply the patch,
# publish the fork commit, update every `rev` below, then run `cargo update`.
#
# `gpui_platform` MUST carry the `font-kit` feature on macOS - without it,
# `gpui_macos` compiles cleanly but the optional `zed-font-kit` dep + Core
# Text glyph rasterization path are excluded (gated on `dep:font-kit` in
# `gpui_macos/Cargo.toml`). The visible symptom is the v0.2.12 "boxes
# drawn, no glyphs" bug: fonts register via `add_fonts()`, `font_id`
# resolves PRIMARY MATCH, the window opens, SVG icons + cursor quads
# paint correctly, but every text glyph rasterizes as an empty bitmap.
# Zed enables this feature explicitly in `zed/crates/zed/Cargo.toml`.
# The feature is a no-op on Linux/Windows (where `gpui_macos` isn't
# compiled in), so it's safe in the cross-platform default declaration
# below - the Linux-only override on line ~97 adds wayland/x11 on top.
gpui = { git = "https://github.com/zed-industries/zed", rev = "afc13dc8e054705a42e2931b0840ed03ccfa583a" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "afc13dc8e054705a42e2931b0840ed03ccfa583a", features = ["font-kit"] }
collections = { git = "https://github.com/zed-industries/zed", rev = "afc13dc8e054705a42e2931b0840ed03ccfa583a" }

# Zed markdown rendering pipeline + design-system primitives. Pinned at the
# same rev as gpui so the workspace graph resolves consistently. Pulls ~51
# Zed workspace crates transitively (language/theme/ui/lsp/...) - accepted
# trade-off for visual parity with Zed's agent panel.
# Bootstraps Zed's `GlobalTheme` at startup. `MarkdownElement::paint` reads
# `cx.theme().colors()` unconditionally for secondary chrome (borders, panel
# backgrounds, etc.) regardless of the `MarkdownStyle` we pass in, so the
# global must exist. `theme::init(LoadThemes::JustBase, cx)` is the minimal
# bootstrap - no JSON theme bundles, no `theme_settings` integration.
# Zed's design-system primitives (Icon + IconName, Disclosure, Label, ...).
# Pinned at the same rev as gpui/markdown/theme. Required so the agent-panel
# thinking + tool-call rows match Zed's exact rendering (`Icon::new(IconName::
# ToolSearch).size(IconSize::Small).color(Color::Muted)` etc.) instead of
# hand-rolled svg() paths.

# Alacritty terminal emulation (upstream crates.io - migrated from Zed fork)
alacritty_terminal = "0.26"
# Named directly because the `TeePty` byte tap implements
# alacritty_terminal's public `tty::EventedReadWrite` traits, whose
# signatures expose `polling` types (not re-exported by the crate). Same
# semver line as alacritty_terminal's own dependency - one shared instance.
polling = "3"

# Internal crates
splitlane-config = { path = "../crates/splitlane-config" }
# Legacy agent identity plus the CLAUDECODE env scrub. The terminal-only
# Agents view no longer carries the in-app ACP chat or SDK wrapper here.
splitlane-acp = { path = "../crates/splitlane-acp" }
# Telemetry plumbing extracted to its own workspace crate so future
# `splitlane-trust` member can emit events without pulling the desktop binary
# into its dep graph.
splitlane-telemetry = { workspace = true }
# GPU-free install engine behind
# `splitlane mcp install|uninstall|status`. Kept in its own crate so its
# `toml_edit` dep stays out of the size-budgeted embedded `splitlane-mcp`
# bridge binary.
splitlane-mcp-install = { path = "../crates/splitlane-mcp-install" }
# std-only bounded-subprocess primitive
# (`run_with_timeout`) adopted at every external-process call site (self-update,
# git, opencode, mcp-install) so a hung tool can't wedge a worker.
splitlane-process = { workspace = true }
# The shared blocking JSON-RPC client the
# `splitlane <verb>` CLI subcommands use to drive a RUNNING instance over the
# existing IPC socket and exit before any GPUI init.
splitlane-ipc-client = { workspace = true }
# File system watcher (OS-native: inotify/FSEvents/ReadDirectoryChanges)
notify = "7"

# Hot-path Mutex / RwLock without poisoning, ~2x faster than std under
# contention. Used for the theme cache that's hit several times per
# render frame; std::sync::Mutex was the dominant lock in the agents
# UI hot path under streaming output. Already a transitive dep via
# gpui/tokio; making it explicit lets us reference it directly.
parking_lot = "0.12"

# TOML reader/writer for the Codex CLI's `~/.codex/config.toml`. Used by the
# composer to mirror the model + reasoning-effort fields into the live pill
# selectors (same bridge pattern as the JSON one for Claude Code's
# `~/.claude/settings.json`).
toml = "0.8"

# Format-preserving TOML editing, for the preset writer. A preset file is
# hand-editable and hand-edited, so saving one from the GUI mutates the
# document it read rather than re-serializing a struct: reconstruction from a
# typed struct is precisely the mechanism by which a GUI destroys `env`,
# `port_base` and the worktree fields it does not draw. Already in the lock
# via `splitlane-mcp-install`; this is a new edge, not a new dependency.
toml_edit = "0.22"

# Standard deps
anyhow.workspace = true
# Argument parser for the `splitlane <verb>`
# CLI surface. `Option<Commands>` keeps "no subcommand => launch the GUI" as the
# default; the `mcp`/`--update-and-exit`/`--help`/`--version` intercepts stay
# manual and run before clap so it never eats their flags.
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
# Async utilities used by app subsystems that need tokio-compatible futures
# without blocking GPUI's smol event loop.
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync", "time"] }
tracing = "0.1"
log.workspace = true
env_logger = "0.11"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
rust-embed = { version = "8.11", features = ["include-exclude"] }
smol = "2.0"
libc = "0.2"
regex = "1"
ctrlc.workspace = true
open = "5"
# Native file picker (markdown "open file" button in the pane tab strip).
# Default features = ["xdg-portal", "wayland"] on Linux: uses the FreeDesktop
# file-chooser portal (no GTK3 runtime dep) and adds Wayland integration so
# the dialog parents to our window. macOS uses NSOpenPanel, Windows uses the
# native COM file-open dialog. `pollster` is pulled in by xdg-portal as the
# tiny block-on executor - keeps the picker runtime-agnostic so we can drive
# `AsyncFileDialog` from `cx.spawn` without a tokio/async-std dep.
rfd = "0.17"
# Markdown viewer pane. CommonMark + tables
# + strikethrough + footnotes via the event API (we walk events directly into
# a GPUI element tree rather than rendering HTML).
pulldown-cmark = { version = "0.10", default-features = false }
# Syntax highlighting for fenced
# code blocks in chat messages. `default-fancy` ships the bundled
# syntax + theme sets plus the FancyRegex engine (~3 MB binary cost,
# judged acceptable).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ureq.workspace = true
# Multi-worktree diff engine.
# Histogram line-diff lifted from Zed's `buffer_diff::compute_hunks`; pinned to
# the same 0.1.8 Zed uses so the ported algorithm matches the reference API.
imara-diff = "0.1.8"

# Diff syntax highlighting. Tree-sitter,
# the same engine Zed uses - fast enough (ms-scale parse) that we highlight at
# build time off-thread, no lazy-viewport machinery needed. Core `tree-sitter`
# 0.26 is already a transitive workspace dep (via the Zed fork); grammars below
# all bridge through `tree-sitter-language` 0.1 (LANGUAGE: LanguageFn, ABI 15,
# accepted by the 0.26 runtime). Each grammar compiles bundled C via `cc`.
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
# Expanded language coverage.
# All bridge through `tree-sitter-language` 0.1 (verified compatible with the
# 0.26 runtime). NOTE: tree-sitter-c / tree-sitter-cpp expose `HIGHLIGHT_QUERY`
# (singular) - every other grammar here uses `HIGHLIGHTS_QUERY` (plural).
# tree-sitter-yaml is the maintained `tree-sitter-grammars` fork (crates.io name
# resolves to it); its highlights query is bundled as a const.
tree-sitter-go = "0.25"
tree-sitter-yaml = "0.7"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
# QueryCursor::captures returns a StreamingIterator (tree-sitter >= 0.25), not
# a std Iterator.
streaming-iterator = "0.1"
semver = "1"
# Re-added as a direct dep: forced per-thread Claude session IDs
# (`claude --session-id <uuid>`) so a live Agents thread maps 1:1 to its
# on-disk session file and can adopt the LLM `ai-title` for its sidebar
# row. `v4` only - already in the build graph via `splitlane-telemetry`.
uuid.workspace = true
# Resolve `appimageupdatetool` on $PATH before falling back to download.
which.workspace = true
# tar.gz self-update: SHA-256 verification + in-process extraction.
# The sync `tar` crate guards against absolute paths and `..` traversal by
# default, so we avoid shelling out to /bin/tar.
#
# Pinned to the 0.10 stable line. 0.11 is a pre-release series and
# a direct 0.11 requirement pulls a second copy of `sha2` into the binary
# when any transitive dep resolves 0.10. We only touch the `Sha256` core API
# (`new`/`update`/`finalize`) which is byte-stable across 0.10 ↔ 0.11, so
# the downgrade is compile-clean.
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

# Atomic rename for extracted AI-hook binaries
# (`src-app/src/ai_hooks/extract.rs`). `NamedTempFile::persist` wraps
# `rename(2)` on Unix and `MoveFileEx(MOVEFILE_REPLACE_EXISTING)` on
# Windows so the cache-dir publish step is atomic on all three OSes.
tempfile.workspace = true

# Cross-platform local IPC. Dispatches to Unix
# domain sockets on Linux/macOS and Windows named pipes (`\\.\pipe\...`)
# transparently, so the JSON-RPC newline-delimited protocol is byte-identical
# across platforms.
interprocess.workspace = true

# Harbor P2.3: local wall-clock for the composer's "stopped by you · 12:41"
# meta line. Already in the dependency graph transitively (with
# `iana-time-zone`), and the alternative is per-OS timezone code for one
# `%H:%M` - `default-features = false` + `clock` keeps it to that.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Grapheme-cluster boundaries for the cursor-aware TextInput widget
# (widgets/text_input.rs). Already a transitive dep via GPUI, so Cargo
# deduplicates - the direct declaration is only needed to `use` the trait.
unicode-segmentation = "1"

# Composer extensions.
#
# `ignore` is the gitignore-respecting walker used by ripgrep. Powers the
# `@`-mention file completion popup (required: "recursive, gitignore-respecting,
# debounced 200ms"). Pulled in directly so the agents composer does not have
# to reimplement .gitignore / .ignore / hidden-file filtering by hand.
#
# `base64` encodes image attachments into the ACP `ImageContent.data` field
# (base64 string with a `mime_type` companion). Already a transitive dep
# (rusqlite, ureq, ...), so the explicit declaration only adds the public
# surface, not a new compile unit.
ignore = "0.4"
base64 = "0.22"

# Desktop notifications fired by the agents runtime when a turn ends, needs
# input, stalls, or exits unexpectedly while the user cannot see that session.
#
# **`notify-rust` is the Linux and Windows backend, and only those two.** Its
# macOS arm is built on `mac-notification-sys`, which is built exclusively on
# `NSUserNotificationCenter` - deprecated in 10.14 and silently ignored by
# current macOS. This line used to name that API as if it were a fact about
# how the notification is delivered; it was a diagnosis. Measured 7 September
# 2026: `show()` answered `Ok(())`, and `splitlane` never appeared in the
# notification daemon's log at all. The macOS arm is `mac-usernotifications`
# below, and `notify-rust` is target-gated so its dead macOS path cannot come
# back by accident.
#
# Release Windows attribution depends on the Start Menu shortcut's
# AppUserModelID in `packaging/wix/main.wxs` matching the runtime app_id.
# Unpackaged/dev builds make a best-effort HKCU AppUserModelID registration
# immediately before sending the toast, but Windows may still require a Start
# Menu shortcut for visible banners.
# Keeping the default features avoids the `libdbus-1-dev` system build dep
# that the legacy `d` feature pulls in. The dependency itself is declared in
# the `cfg(not(target_os = "macos"))` table below, beside the other
# target-gated ones.

# Detached minisign (Ed25519) signature
# verification - the independent root of trust for the self-updater
# (`update/signature.rs`). Verify-only and pure Rust (no libsodium / C dep),
# so it adds no system build deps and compiles identically on the three
# targets. The matching signing side runs in CI (`minisign`/`rsign2`).
minisign-verify = "0.2.5"

# Linux and Windows notifications. See the note above `minisign-verify` for why
# macOS is not in this set.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

# Linux: enable Wayland + X11 display backends for gpui_platform
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "afc13dc8e054705a42e2931b0840ed03ccfa583a", features = ["wayland", "x11"] }
# Native compositor blur for Splitlane's sidebar + title bar. Wayland prefers
# ext-background-effect-v1 and falls back to GPUI's KDE protocol; X11 uses
# KWin's _KDE_NET_WM_BLUR_BEHIND_REGION hint when the effect is advertised.
raw-window-handle = "0.6"
wayland-client = { version = "0.31.14", features = ["dlopen", "system"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
x11rb = { version = "0.13.2", features = ["allow-unsafe-code"] }
# Native host for the standard Linux Ghostty session backend. It remains absent
# from macOS, Windows, and explicit Linux builds using --no-default-features.
portable-pty = { version = "0.9.0", optional = true }
splitlane-terminal-ghostty = { path = "../crates/splitlane-terminal-ghostty", optional = true }

# macOS: libproc powers detect_ports() - walks per-PID socket FDs
# via proc_pidinfo/proc_pidfdinfo wrappers. The macOS-only gate keeps it
# out of the Linux dep closure entirely.
#
# core-text powers the Core-Text-backed monospace enumeration in
# fonts.rs - the macOS path no longer shells out to fc-list (which needs
# Homebrew fontconfig). Already a transitive dep via gpui_macos +
# zed-font-kit, so declaring it direct here adds zero compile units; the
# explicit entry just makes the direct use discoverable.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
core-text = "21"
# core-foundation 0.10 matches the version core-text 21 already pulls (so the
# resolver dedupes and the `TCFType` trait stays coherent across both crates).
# Powers the panic-free Core Text family-name reader in `fonts.rs`.
core-foundation = "0.10"
# Native AppKit material behind the unified sidebar + title bar. GPUI exposes
# its renderer NSView through raw-window-handle; Cocoa/objc let Splitlane add a
# semantic NSVisualEffectView without carrying macOS APIs into other targets.
raw-window-handle = "0.6"
cocoa = "0.26"
objc = "0.2"

# The macOS notification backend: a thin `objc2` wrapper over
# `UNUserNotificationCenter`, by the author of `notify-rust` itself. It brings
# **no compiled Objective-C** - no `build.rs`, no `.m`, no `.c` - so the build
# requirements this project spent `55beb0c` reducing do not grow.
#
# Its dependency cost is smaller than the track note's first estimate: the
# `objc2` 0.6 / `objc2-foundation` 0.3 / `block2` 0.6 / `thiserror` 2 copies it
# wants are **already in the macOS graph** (gpui_macos is on objc2 0.6.4, and
# so is the `mac-notification-sys` that `notify-rust` used to pull in here).
# What is genuinely new is `objc2-user-notifications` and `futures-timer`.
#
# Two facts about this API that the call site depends on, both measured:
# it needs an `.app` bundle (an ad-hoc signature is enough, Developer ID is
# not), so `cargo run` will never show a notification; and `send` answers `ok`
# even when authorization is `Denied`, which is why `notifications.rs` asks
# for the settings rather than trusting the send.
mac-usernotifications = "0.3.1"

# The verified Windows Ghostty archive exists only for x64 MSVC. Keeping these
# optional dependencies on that exact target lets the default feature remain
# enabled while Windows ARM64 and GNU builds compile with the Alacritty path.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64", target_env = "msvc"))'.dependencies]
splitlane-terminal-ghostty = { path = "../crates/splitlane-terminal-ghostty", optional = true }
portable-pty = { version = "0.9.0", optional = true }

# Windows: windows-sys powers the TerminateProcess path in TerminalState::drop
# Feature set kept minimal on purpose: adding
# a new Win32 API elsewhere in the app should require an explicit feature
# append here, not a silent surface expansion. alacritty_terminal 0.26 pulls
# in the same crate at the same version on Windows for its ConPTY path - the
# Cargo resolver deduplicates.
#   - Win32_System_Diagnostics{,_ToolHelp}: foreground-process naming
#     walks the process tree via CreateToolhelp32Snapshot / Process32{First,Next}W.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    # Native fixed-pitch font discovery for the Terminal settings picker.
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Kernel",
    # Workspace/sidebar dev-server detection on Windows: GetExtendedTcpTable
    # returns LISTEN sockets with owner PIDs, and WinSock provides AF_INET(6).
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    # IsWow64Process2 + IMAGE_FILE_MACHINE_*
    # for native-host arch detection (see past WOW64 emulation on ARM64
    # Windows). IsWow64Process2/GetCurrentProcess live in _Threading above;
    # the IMAGE_FILE_MACHINE_* constants live here.
    "Win32_System_SystemInformation",
    # WinVerifyTrust Authenticode check on the
    # downloaded MSI before msiexec (defense-in-depth over minisign). The
    # WINTRUST_DATA struct is gated on _Cryptography, so both features are
    # required; WINTRUST_FILE_INFO + the WTD_* consts live under _WinTrust.
    # Publisher pinning reads the leaf signer cert from WinTrust provider
    # state, which gates WTHelper* helpers behind Catalog + Sip.
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    # Console-subsystem launch handling: GetConsoleProcessList + FreeConsole
    # in `main()` keep scriptable CLI calls blocking/visible in PowerShell
    # while hiding the one-process console Windows creates for Explorer /
    # Start Menu GUI launches.
    "Win32_System_Console",
    # Windows toast attribution: bind the process identity to the same
    # AppUserModelID used by the Start Menu shortcut and WinRT toast sender.
    "Win32_UI_Shell",
    # Custom caption controls need an explicit SW_MAXIMIZE/SW_RESTORE toggle;
    # GPUI's Windows zoom implementation only sends SW_MAXIMIZE.
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    # PeekNamedPipe gates every
    # events.subscribe push on the named pipe's liveness, so a disconnected
    # `splitlane watch` evicts the subscription (RAII) instead of tripping
    # interprocess's overlapped-write CannotUnwind abort. PeekNamedPipe is under
    # Win32_System_Pipes; GetLastError + ERROR_* already live in _Foundation.
    "Win32_System_Pipes",
    # The events.subscribe / reply / rejection writes
    # issue their OWN overlapped WriteFile + GetOverlappedResult instead of
    # going through interprocess's WriteFileEx, so a peer that closes mid-write
    # yields a returned io::Error (ERROR_NO_DATA / ERROR_BROKEN_PIPE) instead of
    # the CannotUnwind process::abort (STATUS_STACK_BUFFER_OVERRUN 0xC0000409).
    # WriteFile lives under _Storage_FileSystem; OVERLAPPED + GetOverlappedResult
    # under _System_IO; CreateEventW is in _Threading above.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # Test-only leak diagnostics: classify current-process handles via
    # NtQuerySystemInformation + NtQueryObject when a Windows stress gate fails.
    "Wdk_Foundation",
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
] }
widestring.workspace = true
# Process-wide Job Object with KILL_ON_JOB_CLOSE so a kill -9
# of Splitlane (or any uncaught crash) takes all spawned agent CLIs and
# PTY hosts with it. win32job exposes the small subset of Job-Object
# API we actually need (CreateJobObject + SetInformationJobObject +
# AssignProcessToJobObject) with a safe Rust API; reaching for the raw
# windows-sys handles would mean ~80 lines of unsafe glue for the same
# result. Kept Windows-only via the target.cfg gate.
win32job = "2.0.3"
# Windows toast attribution for unpackaged/dev runs uses a best-effort
# per-user AppUserModelID registration under
# HKCU\Software\Classes\AppUserModelId.
windows-registry = "0.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "afc13dc8e054705a42e2931b0840ed03ccfa583a", features = ["test-support"] }
# The sign-capable counterpart to `minisign-verify`. Test-only - used
# to generate ephemeral keypairs and sign fixtures so `update/signature.rs`
# exercises a real verify round-trip (happy path + tampered/wrong-key/no-key
# negatives) without baking a private key into the repo.
minisign = "0.9.1"
tracing-test = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The transport probe also runs when Linux tests explicitly disable the
# default Ghostty feature.
portable-pty = "0.9.0"

# Clippy lint policy. Mirrors `[workspace.lints.clippy]` in the
# root Cargo.toml EXCEPT the unwrap/expect family is demoted from "warn"
# to "allow" in this crate - src-app has pre-existing calls in GPUI UI code
# where the failure mode is "app crashes" (acceptable for desktop UI) and
# fixing each was out of scope when the policy landed. New crates (splitlane-ai-hook,
# splitlane-shim, splitlane-config) keep the strict defaults via
# `[lints] workspace = true`.
#
# Follow-up: incremental re-enablement of these three lints in src-app is
# tracked as later cleanup work. When that lands, remove the `allow`
# overrides below, audit each unwrap site, and re-run `cargo clippy
# --workspace -- -D warnings` to regain the strict gate.
[lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "allow"
expect_used = "allow"
unwrap_in_result = "allow"

[lints.rust]
# The `objc` 0.2 `msg_send!` / `sel_impl` macro expands to
# `cfg(feature = "cargo-clippy")` (its old clippy-detection trick). rustc's
# check-cfg flags that as an unexpected `feature` value in this (the
# destination) crate, and a local `#[allow(unexpected_cfgs)]` does NOT silence a
# cfg originating inside an external macro's expansion (rust-lang/rust#124735).
# Declaring the value expected here clears the macOS `cargo clippy` gate (objc
# is macOS-only) while keeping the lint live for our own code.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Windows MSI packaging. Source WXS +
# License.rtf + splitlane.ico live under `packaging/wix/` (kept alongside
# `packaging/{apt,rpm,homebrew,debian}/` per project convention).
# Build: cargo wix --package splitlane-app --target x86_64-pc-windows-msvc --include packaging/wix/main.wxs
#
# GUIDs below were generated once by `cargo wix init` and MUST remain
# stable for the lifetime of this product line:
#   * upgrade-guid - the MSI `UpgradeCode` used by `MajorUpgrade` to
#     detect and replace previous installs. Changing it makes new MSIs
#     install alongside the old one instead of upgrading in-place,
#     breaking every existing user's update flow.
#   * path-guid    - the `Path` component GUID controlling the PATH
#     environment-variable entry. Changing it orphans the old entry
#     (it's keyed off the GUID, not the name).
# Both values are also mirrored in packaging/wix/main.wxs - edit in pairs
# if they ever must change (only with a v2.0 product-line cut).
[package.metadata.wix]
wxs = "../packaging/wix/main.wxs"
upgrade-guid = "177D8F43-1642-4212-9CB0-FD14B299058D"
path-guid = "49700ADE-7E1B-466E-A25E-A138A2FC96F3"
# MSI filename root: `splitlane-<version>-<arch>.msi`. Matches the
# `AssetFormat::Msi` matcher suffix
# (`-x86_64-pc-windows-msvc.msi`).
name = "splitlane"

# Debian packaging - explicit deps, never `$auto` (cargo-deb issue #170).
# Build: cargo deb -p splitlane-app --target x86_64-unknown-linux-gnu
[package.metadata.deb]
name = "splitlane"
maintainer = "Ivan Kalashnik <ivkan@users.noreply.github.com>"
copyright = "2025 Arthur Jean, 2026 Ivan Kalashnik"
license-file = ["../LICENSE", "0"]
changelog = "../debian/changelog"
section = "utils"
priority = "optional"
revision = "1"
# Debian maintainer scripts: `packaging/debian/` contains `postinst` (wires
# the pkg.github.com/ivkan/splitlane apt source on first install). The directory
# path is resolved relative to THIS Cargo.toml (cargo-deb convention -
# differs from cargo-generate-rpm below, which resolves relative to the
# workspace root). cargo-deb auto-sets 755 on all control scripts.
maintainer-scripts = "../packaging/debian"
# `fontconfig` (not just `libfontconfig1`) provides the `fc-list` BINARY the
# settings font picker shells out to (`fonts.rs`); without it the picker is
# empty on slim images.
depends = "libc6, libwayland-client0, libxcb1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libvulkan1, libfontconfig1, libfreetype6, fontconfig, ca-certificates"
extended-description = """\
Splitlane is a native Rust terminal workspace for running coding agents in
parallel. Launch Claude Code, Codex, opencode, Pi, and other CLI agents in real
panes; keep each session visible; and see when one needs input.

Features horizontal and vertical split panes with drag-to-resize (up to 32
panes), branch-aware workspaces with session restore, in-app Git diffs and
agent review prompts, an MCP bridge for pane reading, configurable keybindings,
and JSON-RPC 2.0 IPC for local automation. The Linux package supports both
Wayland and X11."""
assets = [
    ["target/release/splitlane", "usr/bin/", "755"],
    ["../native/libghostty/THIRD_PARTY_NOTICES.md", "usr/share/doc/splitlane/THIRD_PARTY_NOTICES.md", "644"],
    ["../assets/splitlane.desktop", "usr/share/applications/splitlane.desktop", "644"],
    ["../assets/icons/splitlane-16.png",  "usr/share/icons/hicolor/16x16/apps/splitlane.png",     "644"],
    ["../assets/icons/splitlane-32.png",  "usr/share/icons/hicolor/32x32/apps/splitlane.png",     "644"],
    ["../assets/icons/splitlane-48.png",  "usr/share/icons/hicolor/48x48/apps/splitlane.png",     "644"],
    ["../assets/icons/splitlane-128.png", "usr/share/icons/hicolor/128x128/apps/splitlane.png",   "644"],
    ["../assets/icons/splitlane-256.png", "usr/share/icons/hicolor/256x256/apps/splitlane.png",   "644"],
    ["../assets/icons/splitlane-512.png", "usr/share/icons/hicolor/512x512/apps/splitlane.png",   "644"],
    ["../assets/io.github.ivkan.splitlane.metainfo.xml", "usr/share/metainfo/io.github.ivkan.splitlane.metainfo.xml", "644"],
    ["../packaging/splitlane-release.asc", "usr/share/keyrings/splitlane-archive.asc", "644"],
]

# RPM packaging - mirrors the Debian asset list plus an explicit
# LICENSE entry (on the deb side LICENSE comes in via `license-file`, not
# the `assets` array). Built by cargo-generate-rpm 0.20.0:
# `cargo generate-rpm -p src-app --target x86_64-unknown-linux-gnu`.
# (Note: `-p src-app` is the DIRECTORY path - cargo-generate-rpm 0.20.0
# resolves `-p` strictly as a path, not the crate name `splitlane-app`.)
#
# - Asset `source` paths are resolved relative to the workspace root by
#   cargo-generate-rpm 0.20.0, NOT to this Cargo.toml's directory - hence
#   `assets/` rather than `../assets/`. The special `target/release/*`
#   prefix is auto-rewritten to the `--target` output directory.
# - `auto-req = "no"` mirrors the reason we avoid `$auto` in cargo-deb
#   (over-collection; issue #170 in cargo-deb). The explicit `requires`
#   table below is the single source of truth for runtime deps on Fedora/
#   RHEL/Rocky/openSUSE.
# - `%license` is NOT a supported asset tag in cargo-generate-rpm 0.20.0
#   (the crate exposes `doc` but not `license`). The LICENSE file is
#   therefore installed with `%doc` instead - functionally equivalent for
#   `rpm -qlp` inspection, but upstream RPM purists note the distinction.
#   If we ever move to `rpmbuild`, restore the `%license` tag.
# - THIRD_PARTY_NOTICES.md deliberately is not tagged `%doc`: minimal Fedora
#   and openSUSE images exclude optional docs, but this compliance notice must
#   remain installed with the application payload.
[package.metadata.generate-rpm]
# Override the RPM NAME to `splitlane` (dropping the `-app` suffix of the
# crate itself). Keeps the artifact filename in sync with both cargo-deb
# (which also renames to `splitlane`) and the `update_checker` asset
# picker, which matches on the literal `splitlane-<version>-<arch>.rpm`.
name = "splitlane"
release = "1"
auto-req = "no"
# RPM `%post` scriptlet: wires /etc/yum.repos.d/splitlane.repo on first
# install. Path is resolved relative to the workspace root
# (cargo-generate-rpm's path-resolution convention - differs from the
# crate-relative `maintainer-scripts` above).
post_install_script = "packaging/rpm/postinst.sh"
# RPM `%preun` scriptlet: removes /etc/yum.repos.d/splitlane.repo on full
# uninstall only ($1 == 0). On upgrades ($1 >= 1) the file must stay so
# `dnf check-update` keeps seeing pkg.github.com/ivkan/splitlane.
pre_uninstall_script = "packaging/rpm/preun.sh"
# RPM `%postun` scriptlet: refreshes the freedesktop icon + desktop
# caches after the package payload is removed, so stale
# /usr/share/icons/hicolor/*/apps/splitlane.png cache entries and the
# removed splitlane.desktop stop being surfaced by GNOME Shell / KDE
# Plasma. Idempotent on upgrades; load-bearing on final uninstall.
post_uninstall_script = "packaging/rpm/postun.sh"
assets = [
    { source = "target/release/splitlane",                                       dest = "/usr/bin/splitlane",                                                         mode = "755" },
    { source = "native/libghostty/THIRD_PARTY_NOTICES.md",                      dest = "/usr/share/doc/splitlane/THIRD_PARTY_NOTICES.md",                              mode = "644" },
    { source = "assets/splitlane.desktop",                                       dest = "/usr/share/applications/splitlane.desktop",                                  mode = "644" },
    { source = "assets/icons/splitlane-16.png",                                  dest = "/usr/share/icons/hicolor/16x16/apps/splitlane.png",                          mode = "644" },
    { source = "assets/icons/splitlane-32.png",                                  dest = "/usr/share/icons/hicolor/32x32/apps/splitlane.png",                          mode = "644" },
    { source = "assets/icons/splitlane-48.png",                                  dest = "/usr/share/icons/hicolor/48x48/apps/splitlane.png",                          mode = "644" },
    { source = "assets/icons/splitlane-128.png",                                 dest = "/usr/share/icons/hicolor/128x128/apps/splitlane.png",                        mode = "644" },
    { source = "assets/icons/splitlane-256.png",                                 dest = "/usr/share/icons/hicolor/256x256/apps/splitlane.png",                        mode = "644" },
    { source = "assets/icons/splitlane-512.png",                                 dest = "/usr/share/icons/hicolor/512x512/apps/splitlane.png",                        mode = "644" },
    { source = "assets/io.github.ivkan.splitlane.metainfo.xml",            dest = "/usr/share/metainfo/io.github.ivkan.splitlane.metainfo.xml",           mode = "644" },
    { source = "LICENSE",                                                       dest = "/usr/share/doc/splitlane/LICENSE",                                           mode = "644", doc = true },
]

# Cross-distro RPM runtime deps. All entries use SONAME virtual provides
# instead of package names, because package nomenclature differs between
# Fedora/RHEL/Rocky and openSUSE:
#
#   Fedora/RHEL          openSUSE Tumbleweed
#   ───────────────────  ─────────────────────
#   vulkan-loader        libvulkan1
#   libxkbcommon         libxkbcommon0
#   libxkbcommon-x11     libxkbcommon-x11-0
#   fontconfig           fontconfig (same)
#   freetype             libfreetype6
#
# Every package above exports the same SONAME virtual provide regardless
# of its package name, so listing the SONAMEs gives us one cross-distro
# requires-set that resolves on Fedora 30+, RHEL 8+, Rocky, Mageia,
# openSUSE Leap 15+, and openSUSE Tumbleweed without per-distro fan-out.
# The `(64bit)` ABI tag is correct for both x86_64 and aarch64 RPM
# builds - it indicates the 64-bit ABI, not CPU arch (i686 would use
# `(32bit)`). Verified against pkgs.org SONAME lookup for each library.
[package.metadata.generate-rpm.requires]
"libvulkan.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libfontconfig.so.1()(64bit)" = "*"
"libfreetype.so.6()(64bit)" = "*"
# The `fc-list` BINARY (in the `fontconfig` package) the settings font picker
# shells out to. A file dependency resolves the right package on every rpm
# distro without per-distro package-name fan-out.
"/usr/bin/fc-list" = "*"
